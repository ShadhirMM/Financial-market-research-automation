# PUBLIC SAMPLE configuration: the same as config.toml, minus series whose owners do not allow
# redistribution (S&P 500, Dow Jones, Nasdaq, VIX, ICE BofA HY spread). Used only to build the
# committed live sample in docs/sample/ by rebuilding from a live run's raw files.
# Generated by tools/make_public_config.py; do not edit by hand.

# Market & macro research pack: configuration.
# No secrets here. The optional webhook URL and Anthropic API key come from
# environment variables (see .env.example).

[run]
# Days of history to download (enough for 1-year changes, 52-week ranges and YTD).
history_days = 800

[http]
# Generic, honest client name. No personal data is sent.
user_agent = "market-research-pack/1.0 (+https://github.com/ShadhirMM/Financial-market-research-automation)"
# Per-host politeness limit.
requests_per_second = 2
timeout_seconds = 30
max_retries = 3
backoff_seconds = [2, 10, 30]

[output]
reports_dir = "reports/public-sample"
raw_dir = "data/raw"
logs_dir = "logs/public-sample"
keep_raw_days = 90
keep_reports = 52
chart_days = 365

[validation]
# A series whose last observation is older than this many business days is stale.
stale_business_days = 5
# A gap of more than this many business days inside the last year is reported.
max_gap_business_days = 7
# 2s10s from the Treasury curve and FRED T10Y2Y should agree within this many basis points.
curve_consistency_bps = 10

[ai]
# Optional plain-English summary written by Claude from the computed numbers only.
# Runs only when enabled = true AND ANTHROPIC_API_KEY is set.
enabled = false
model = "claude-opus-5-5"
effort = "low"

# ---------------------------------------------------------------- series
# source: fred | ecb | treasury
# change: pct (levels: % change) or bps (rates and spreads: basis-point change)
# valid_min/valid_max: values outside are data errors.
# max_jump: largest believable one-day move (pct for 'pct' series, bps for 'bps' series).

[[series]]
id = "DFF"
source = "fred"
label = "Fed funds effective rate"
category = "Rates"
unit = "percent"
change = "bps"
valid_min = -1
valid_max = 25
max_jump = 80

[[series]]
id = "DGS2"
source = "fred"
label = "US Treasury 2-year yield"
category = "Rates"
unit = "percent"
change = "bps"
valid_min = -1
valid_max = 25
max_jump = 60

[[series]]
id = "DGS10"
source = "fred"
label = "US Treasury 10-year yield"
category = "Rates"
unit = "percent"
change = "bps"
valid_min = -1
valid_max = 25
max_jump = 50

[[series]]
id = "T10Y2Y"
source = "fred"
label = "10-year minus 2-year spread"
category = "Rates"
unit = "percent"
change = "bps"
valid_min = -5
valid_max = 5
max_jump = 50

[[series]]
id = "DCOILBRENTEU"
source = "fred"
label = "Brent crude oil (USD/bbl)"
category = "Commodities"
unit = "usd"
change = "pct"
valid_min = 5
valid_max = 400
max_jump = 25
# FRED publishes oil prices with a lag of about a week.
stale_business_days = 10

[[series]]
id = "DCOILWTICO"
source = "fred"
label = "WTI crude oil (USD/bbl)"
category = "Commodities"
unit = "usd"
change = "pct"
# WTI briefly traded below zero in April 2020.
valid_min = -50
valid_max = 400
max_jump = 25
# FRED publishes oil prices with a lag of about a week.
stale_business_days = 10

# FX: ECB euro reference rates (units of currency per 1 EUR). USD crosses are
# derived as described in docs/DATA_DICTIONARY.md.
[[series]]
id = "EURUSD"
source = "ecb"
label = "EUR/USD (USD per EUR)"
category = "FX"
unit = "rate"
change = "pct"
valid_min = 0.5
valid_max = 2.5
max_jump = 5

[[series]]
id = "GBPUSD"
source = "ecb"
label = "GBP/USD (USD per GBP)"
category = "FX"
unit = "rate"
change = "pct"
valid_min = 0.5
valid_max = 3.0
max_jump = 8

[[series]]
id = "USDJPY"
source = "ecb"
label = "USD/JPY (JPY per USD)"
category = "FX"
unit = "rate"
change = "pct"
valid_min = 50
valid_max = 400
max_jump = 6

[[series]]
id = "USDCHF"
source = "ecb"
label = "USD/CHF (CHF per USD)"
category = "FX"
unit = "rate"
change = "pct"
valid_min = 0.3
valid_max = 2.0
max_jump = 15

[[series]]
id = "USDCNY"
source = "ecb"
label = "USD/CNY (CNY per USD)"
category = "FX"
unit = "rate"
change = "pct"
valid_min = 4
valid_max = 12
max_jump = 4

# Treasury par yield curve: tenors shown in the Curve sheet.
[treasury]
tenors = ["1 Mo", "3 Mo", "6 Mo", "1 Yr", "2 Yr", "3 Yr", "5 Yr", "7 Yr", "10 Yr", "20 Yr", "30 Yr"]

# ---------------------------------------------------------------- research checks
# type: level (latest value), change (over window: 1W 1M 3M YTD 1Y),
#       drawdown (from 52-week high, %), curve (2s10s in bps from the Treasury curve)
# direction: above | below | abs  (abs = absolute size of the move)
# A rule gives WATCH at `watch` and ALERT at `alert`.

[[checks]]
name = "Yield curve 2s10s"
series = "curve"
type = "curve"
direction = "below"
watch = 0
alert = -50
why = "An inverted curve (10-year below 2-year) has preceded most US recessions."

[[checks]]
name = "10-year yield weekly move"
series = "DGS10"
type = "change"
window = "1W"
direction = "abs"
watch = 20
alert = 35
why = "Large weekly moves in the 10-year yield reprice mortgages, equities and bond holdings."

[[checks]]
name = "Brent oil monthly move"
series = "DCOILBRENTEU"
type = "change"
window = "1M"
direction = "abs"
watch = 10
alert = 20
why = "Big oil moves feed into inflation and energy costs."

[[checks]]
name = "EUR/USD weekly move"
series = "EURUSD"
type = "change"
window = "1W"
direction = "abs"
watch = 2
alert = 4
why = "Large FX moves change the USD value of euro-denominated holdings and costs."

[[checks]]
name = "USD/JPY weekly move"
series = "USDJPY"
type = "change"
window = "1W"
direction = "abs"
watch = 2.5
alert = 5
why = "Sharp yen moves often coincide with carry-trade unwinds and global risk-off."
