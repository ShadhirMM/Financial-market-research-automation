[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research-pack"
version = "1.0.0"
description = "Downloads official public market and macro data (FRED, U.S. Treasury, ECB), cleans and validates it, runs research checks and writes a clean Excel report on a schedule."
authors = [{ name = "Mushaff Shadhir" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
market-research = "market_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
